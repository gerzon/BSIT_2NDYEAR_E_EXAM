<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Sasuke Running Silhouette (more angular, brooding) -->
  <g fill="#1C1C1C">
    <!-- Head -->
    <ellipse cx="100" cy="50" rx="28" ry="34"/>
    <!-- Hair (Sasuke's spiky messy hair pointing down/back) -->
    <polygon points="72,30 62,5 78,25"/>
    <polygon points="85,18 78,-8 92,15"/>
    <polygon points="100,15 100,-12 108,15"/>
    <polygon points="115,18 118,-6 120,20"/>
    <polygon points="128,28 138,5 130,32"/>
    <!-- Headband -->
    <rect x="70" y="32" width="60" height="10" rx="2"/>
    <rect x="95" y="29" width="10" height="15" rx="1"/>
    <!-- Body lean forward -->
    <ellipse cx="100" cy="118" rx="33" ry="48" transform="rotate(10,100,118)"/>
    <!-- Left arm back -->
    <path d="M72,100 Q45,115 35,145 Q33,150 38,147 Q52,140 70,118" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Right arm forward (Chidori pose!) -->
    <path d="M120,95 Q150,78 165,75 Q170,74 168,79 Q160,88 130,105" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Lightning effect around hand -->
    <path d="M165,75 L175,65 L168,72 L180,68 L170,78" stroke="#1C1C1C" fill="none" stroke-width="2.5"/>
    <path d="M160,78 L170,55 L165,70 L172,60 L162,76" stroke="#1C1C1C" fill="none" stroke-width="2.5"/>
    <!-- Left leg back -->
    <path d="M78,155 Q62,200 55,250 Q53,258 60,255 Q70,245 82,200 Q86,180 86,158" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Right leg forward -->
    <path d="M112,155 Q130,200 138,250 Q140,258 133,255 Q125,245 115,200 Q112,180 110,158" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Jacket collar (high Uchiha collar) -->
    <path d="M75,80 Q100,90 120,80 Q118,70 100,68 Q82,70 75,80" fill="#1C1C1C"/>
    <!-- Curse mark hint -->
    <ellipse cx="90" cy="95" rx="5" ry="7" stroke="#1C1C1C" fill="none" stroke-width="2.5"/>
    <path d="M87,92 Q90,100 93,92" stroke="#1C1C1C" fill="none" stroke-width="1.5"/>
  </g>
</svg>