<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Naruto Running Silhouette -->
  <g fill="#1C1C1C">
    <!-- Head -->
    <ellipse cx="100" cy="50" rx="30" ry="35"/>
    <!-- Hair spikes (Naruto's spiky hair) -->
    <polygon points="70,35 60,10 80,30"/>
    <polygon points="80,20 75,-5 90,18"/>
    <polygon points="95,15 95,-10 105,15"/>
    <polygon points="110,18 115,-5 120,20"/>
    <polygon points="125,30 135,5 130,35"/>
    <!-- Headband -->
    <rect x="68" y="35" width="64" height="10" rx="2"/>
    <rect x="95" y="32" width="10" height="15" rx="1"/>
    <!-- Body leaning forward (running pose) -->
    <ellipse cx="100" cy="120" rx="35" ry="50" transform="rotate(15,100,120)"/>
    <!-- Left arm back -->
    <path d="M70,100 Q40,110 30,140 Q28,145 35,142 Q50,135 70,115" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Right arm forward -->
    <path d="M120,95 Q145,80 160,85 Q165,86 162,90 Q150,95 130,105" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Left leg back -->
    <path d="M75,155 Q60,200 50,250 Q48,258 55,255 Q65,245 80,200 Q85,180 85,160" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Right leg forward -->
    <path d="M115,155 Q135,200 145,250 Q147,258 140,255 Q130,245 120,200 Q115,180 110,160" stroke="#1C1C1C" fill="#1C1C1C"/>
    <!-- Jacket collar -->
    <path d="M75,85 Q100,95 120,85 Q115,75 100,72 Q85,75 75,85" fill="#1C1C1C"/>
    <!-- Whisker marks -->
    <line x1="65" y1="45" x2="50" y2="48" stroke="#1C1C1C" stroke-width="2.5"/>
    <line x1="65" y1="52" x2="50" y2="54" stroke="#1C1C1C" stroke-width="2.5"/>
    <line x1="65" y1="59" x2="52" y2="60" stroke="#1C1C1C" stroke-width="2.5"/>
  </g>
</svg>