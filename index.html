<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Personal Website</title>

  <script>

    let count = 0;
button.addEventListener("click", () => {
  count++;
  message.textContent = `Clicked ${count} times`;
});

  </script>

  <style>
    /* ===== RESET ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      line-height: 1.6;
      background: #f7f7f7;
      color: #333;
    }

    /* ===== LAYOUT ===== */
    header {
      background: #111;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: auto;
      padding: 1.5rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      text-align: center;
      margin-top: 2rem;
    }

    .hero img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      min-height: 44px;
    }

    button:hover {
      background: #0056b3;
    }

    .message {
      margin-top: 1rem;
      font-weight: bold;
      color: green;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    /* ===== DESKTOP ===== */
    @media (min-width: 768px) {
      .hero {
        flex-direction: row;
        text-align: left;
      }

      .hero-text {
        flex: 1;
      }

      .hero-image {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Gerzon C. Luzon</h1>
    <p>Bahug-Bahug Lover • Kulafo Drinker • IT Instructor</p>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-text">
        <h2>Hello 👋</h2>
        <p>
          Welcome to my page!
          This page is a little bit about me, for personal blog purposes only.
          Di lang pam-pamilya pang sports pa!
        </p>

        <button id="clickMeBtn">Click Me</button>
        <div class="message" id="message"></div>
      </div>

      <div class="hero-image">
        <img src="https://picsum.photos/500/300" alt="Sample image" />
      </div>
    </section>
  </main>

  <footer>
    © kuyaGigi
  </footer>

  <script>
    const button = document.getElementById("clickMeBtn");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      message.textContent = "Nice! JavaScript is working 🚀";
    });
  </script>

</body>
</html>
